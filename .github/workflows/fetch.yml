name: Fetch News

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 (UTC 기준 0, 3, 6, 9, 12, 15, 18, 21시)
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: pharma-db-write    # cleanup.yml과 동일한 그룹 → 동시 실행 방지
  cancel-in-progress: false

permissions:
  contents: read
  actions: write     # 아래 keepalive 단계에서 워크플로 재활성화에 필요

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & score news
        timeout-minutes: 40
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch.py

      # GitHub은 저장소에 60일간 커밋이 없으면 예약(schedule) 워크플로를 자동
      # 비활성화한다(disabled_inactivity). 2026-09 실제로 이 때문에 수집이 멈추고
      # Supabase 무료 DB까지 7일 무활동으로 일시중지돼 사이트 전체가 다운됐음.
      # 매 실행마다 두 워크플로를 API로 재활성화해 비활성화 타이머를 초기화한다.
      - name: Keep scheduled workflows alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in fetch.yml cleanup.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
