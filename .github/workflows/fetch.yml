name: Fetch News

on:
  schedule:
    - cron: '23 */3 * * *'  # 3시간마다 (UTC 0, 3, …, 21시 23분 — 예약이 몰리는 정각을 피함)
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: pharma-db-write    # cleanup.yml과 동일한 그룹 → 동시 실행 방지
  cancel-in-progress: false

permissions:
  contents: read
  actions: write     # 아래 keepalive 단계에서 워크플로 재활성화에 필요

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & score news
        timeout-minutes: 40
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch.py

      # 카카오 브리핑 예약(kakao-brief.yml)이 GitHub 사정으로 누락돼도 하루 한 번은 반드시 발송되도록,
      # 수집 직후 '평일 06시 이후 + 오늘 미발송'이면 여기서 대신 보낸다 (이미 보냈으면 바로 종료)
      - name: Send Kakao brief if due
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASHBOARD_URL:       ${{ vars.DASHBOARD_URL }}
        run: python kakao_brief.py --if-due

      # GitHub은 저장소에 60일간 커밋이 없으면 예약(schedule) 워크플로를 자동
      # 비활성화한다(disabled_inactivity). 2026-09 실제로 이 때문에 수집이 멈추고
      # Supabase 무료 DB까지 7일 무활동으로 일시중지돼 사이트 전체가 다운됐음.
      # 매 실행마다 두 워크플로를 API로 재활성화해 비활성화 타이머를 초기화한다.
      - name: Keep scheduled workflows alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in fetch.yml cleanup.yml kakao-brief.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
